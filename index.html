<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basebase</title>
    <meta name="description" content="Basebase has wound down operations. Thank you to everyone who built with us." />
    <link rel="canonical" href="https://www.basebase.com/" />
    <link rel="icon" href="/basebase_logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/basebase_logo-256.png" />

    <meta property="og:title" content="Basebase" />
    <meta property="og:description" content="Basebase has wound down operations. Thank you to everyone who built with us." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Basebase" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Basebase" />
    <meta name="twitter:description" content="Basebase has wound down operations. Thank you to everyone who built with us." />

    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      html,
      body {
        max-width: 100vw;
        overflow-x: hidden;
      }

      body {
        font-family: 'Geist', system-ui, sans-serif;
        line-height: 1.5;
        background: #000000;
        color: #e4e4e7;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1,
      p {
        text-wrap: pretty;
      }

      main {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 5rem 1.5rem;
      }

      .wrap {
        width: 100%;
        max-width: 32rem;
      }

      .logo {
        display: block;
        margin-bottom: 2.5rem;
      }

      h1 {
        font-size: 1.875rem;
        line-height: 2.25rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #ffffff;
      }

      .rule {
        margin-top: 1.5rem;
        height: 1px;
        width: 4rem;
        background: #ff9f1c;
      }

      .copy {
        margin-top: 2rem;
        font-size: 1rem;
        line-height: 1.625;
        color: #a1a1aa;
      }

      .copy > * + * {
        margin-top: 1.25rem;
      }

      dl {
        margin-top: 3rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 2rem;
        font-size: 0.875rem;
        line-height: 1.25rem;
      }

      dl > div + div {
        margin-top: 1rem;
      }

      dt {
        color: #71717a;
      }

      dd {
        margin-top: 0.25rem;
      }

      a {
        color: #d4d4d8;
        text-decoration: underline;
        text-decoration-color: rgba(255, 255, 255, 0.25);
        text-underline-offset: 4px;
        transition: color 150ms cubic-bezier(0.4, 0, 0.2, 1), text-decoration-color 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      a:hover {
        color: #ff9f1c;
        text-decoration-color: #ff9f1c;
      }

      @media (min-width: 640px) {
        h1 {
          font-size: 2.25rem;
          line-height: 2.5rem;
        }

        dl > div {
          display: flex;
          gap: 1rem;
        }

        dt {
          width: 10rem;
          flex-shrink: 0;
        }

        dd {
          margin-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wrap">
        <img class="logo" src="/basebase_logo.svg" alt="" width="44" height="44" />

        <h1>Basebase has wound down.</h1>

        <div class="rule" aria-hidden="true"></div>

        <div class="copy">
          <p>
            Basebase is no longer operating, and the product has been discontinued. Thank you to
            the customers, partners, and teammates who built Multiplayer AI with us — it was a
            genuine privilege.
          </p>
        </div>

        <dl>
          <div>
            <dt>General questions</dt>
            <dd><a href="mailto:hello@basebase.com">hello@basebase.com</a></dd>
          </div>
          <div>
            <dt>Data &amp; privacy requests</dt>
            <dd><a href="mailto:privacy@basebase.com">privacy@basebase.com</a></dd>
          </div>
        </dl>
      </div>
    </main>
  </body>
</html>
